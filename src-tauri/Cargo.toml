[package]
name = "icarus-diary"
version = "0.8.0"
description = "Icarus Diary — a local-first, air-gapped diarying app."
authors = ["Icarus"]
edition = "2021"
rust-version = "1.98.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/tiny-mammal/icarus"

# The Tauri build pipeline compiles the app's Rust into both a shared library
# (for mobile, unused here) and a binary, so we expose the lib explicitly.
[lib]
name = "icarus_diary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep the minor versions in step with the @tauri-apps/* npm packages:
# `tauri build` refuses to bundle when they differ.
tauri = { version = "2.12", features = [] }
tauri-plugin-fs = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Locates the data directory before Linux redirects XDG (src/diary_dir.rs).
dirs = "7"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2.4"

# The opt-in update check (src/updates.rs). Desktop only: the Android app
# has no network access at all.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
