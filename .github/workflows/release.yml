name: Release

# Push a `v<version>` tag that matches package.json to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
# Each platform builds on its own runner, then `publish` uploads every file to
# the R2 bucket served at https://icarus.4oli.com/download and switches
# `latest.json` to the new version last, so visitors never see a partial
# release. Desktop builds are unsigned for now; the Android APK is signed with
# the project's own key (see README → Releases).
#
# Pull requests that touch the packaging or the Android app run the builds and
# the Android smoke test without publishing.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-assets.ts
      - site/releases.ts
      - src-tauri/**
      - src/lib/storage/**
      - e2e/android/**
      - playwright.android.config.ts

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.98.1
  PNPM_VERSION: 12.4.1
  NODE_VERSION: 24
  ANDROID_NDK: 27.2.12479018
  # The emulator API for the smoke test; 34 boots more reliably on hosted runners.
  ANDROID_API: 34

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        # A separate assignment, so a tag that doesn't match package.json fails
        # the step instead of being swallowed by `echo`.
        run: |
          version=$(node scripts/release-assets.ts version $TAG)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported runner keeps the Linux builds compatible with
          # older glibc versions.
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - platform: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # GitHub's hosted macOS runners kept cancelling jobs for lack of
          # capacity; Blacksmith's Apple Silicon runners are available.
          - platform: macos
            runner: blacksmith-6vcpu-macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust-targets || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - run: node scripts/release-assets.ts collect "src-tauri/target/${{ matrix.target }}/release/bundle" ${{ matrix.platform }} release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  android:
    needs: version
    runs-on: ubuntu-24.04
    env:
      APK_ROOT: src-tauri/gen/android/app/build/outputs/apk
    steps:
      # Three Rust release targets, a debug build and the emulator image don't
      # fit in the runner's free disk. Drop preinstalled toolchains we never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/julia* \
            /usr/local/share/chromium /usr/lib/google-cloud-sdk /usr/lib/jvm
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-android
      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile

      # Releases must be signed with the project key: Android only installs an
      # update signed with the same key as the installed app.
      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish an unsigned APK"
              exit 1
            fi
            echo "No signing key on this run: the release APK stays unsigned."
            exit 0
          fi
          cd src-tauri/gen/android
          echo "$KEYSTORE_BASE64" | base64 --decode > release.p12
          {
            echo "storeFile=release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=icarus"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build the release APK
        run: pnpm tauri android build --ci --apk --target aarch64 armv7 x86_64
      - name: Check the APK signature
        if: github.ref_type == 'tag'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK_ROOT/universal/release/"*.apk
      - if: github.ref_type == 'tag'
        run: node scripts/release-assets.ts collect "$APK_ROOT" android release-assets
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

      # Debug builds expose the WebView to DevTools, which the smoke test uses
      # to drive the real app on an emulator.
      - name: Build the debug APK for the smoke test
        run: pnpm tauri android build --ci --debug --apk --target x86_64
      - name: Disk left for the emulator
        run: df -h /
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            e2e/android/release-boots.sh "$(ls "$APK_ROOT"/universal/release/*.apk)"
            adb install -r "$APK_ROOT/universal/debug/app-universal-debug.apk"
            pnpm exec playwright test --config playwright.android.config.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-report
          path: |
            playwright-report/
            release-welcome.png
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [version, desktop, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # One publish at a time across all tags, so two releases can't race for
    # latest.json.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: icarus-releases
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/release-assets.ts manifest release-assets latest.json
      # Published versions are immutable, so the live manifest never points at
      # files that are being overwritten.
      - name: Refuse to republish or replace a newer release
        # Only a 404 means "nothing published yet"; any other failure stops the
        # publish rather than risk replacing a newer release.
        run: |
          status=$(curl -sS -o current.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects/latest.json")
          case "$status" in
            200) node scripts/release-assets.ts check-latest current.json ;;
            404) echo "No published release yet." ;;
            *) echo "::error::Could not read the published latest.json (HTTP $status)"; cat current.json; exit 1 ;;
          esac
      - name: Upload builds
        run: |
          for file in release-assets/*; do
            pnpm exec wrangler r2 object put "$BUCKET/v$VERSION/$(basename "$file")" \
              --file "$file" --content-type application/octet-stream --remote
          done
      - name: Point latest.json at this release
        run: |
          pnpm exec wrangler r2 object put "$BUCKET/latest.json" \
            --file latest.json --content-type application/json --remote
      - run: |
          {
            echo "### Icarus Diary $VERSION published"
            echo
            echo '```json'
            cat latest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
