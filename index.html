<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Icarus, a private, open-source diary. Your entries stay on this device." />
    <!--
      Defence in depth for browser mode: no third-party code, no network beyond
      the app's own origin (Vite's HMR socket in development), and WebAssembly
      only for Argon2. Kept no stricter than site/public/_headers (both apply
      on icarus.4oli.com) or src-tauri/tauri.conf.json.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Icarus Diary</title>
    <!--
      Boot splash, painted before any script loads so the page is never blank
      while the app bundle downloads. Colours mirror the ink and muted tokens
      in src/styles/theme.css. src/lib/boot-splash.ts fades it out once the
      first screen is ready; being fixed, it never shifts the layout below.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #09090b;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #09090b;
        transition: opacity 200ms ease-out;
      }
      #boot.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot span {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: #8b8b94;
        animation: boot-ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @keyframes boot-ping {
        75%,
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Icarus"><span></span></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
